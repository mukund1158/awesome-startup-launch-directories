name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate dataset
        run: node scripts/validate.mjs
      - name: README is in sync with the dataset
        run: node scripts/generate.mjs --check
